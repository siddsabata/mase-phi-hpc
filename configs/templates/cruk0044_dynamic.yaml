# CRUK0044 Longitudinal Analysis Configuration (Structure Optimization)
# Unified longitudinal cancer evolution analysis with structure-focused marker selection

# Patient identification  
patient_id: "CRUK0044"

# Input file paths - UPDATE THESE PATHS FOR YOUR ENVIRONMENT
input_files:
  aggregation_dir: "/home/ssabata/patient_data/cruk0044/initial/aggregation_results/"
  ssm_file: "/home/ssabata/patient_data/cruk0044/initial/ssm_filtered.txt"  # Pre-filtered SSM from bootstrap stage
  longitudinal_data: "/home/ssabata/tracerx-mp/data/input/cruk0044_liquid.csv"
  # Base directory of the TracerX-MP repository
  code_dir: "/home/ssabata/tracerx-mp/"

# Output configuration
output:
  base_dir: "/home/ssabata/patient_data/cruk0044/longitudinal/"

# Analysis parameters
parameters:
  # Number of markers for optimization (used for future marker selection)
  n_markers: 5
  # Expected read depth for ddPCR analysis 
  read_depth: 90000
  method: "phylowgs"
  # Weight for fraction-based objective (0.0 = focus on structure)
  lambda1: 0.0
  # Weight for structure-based objective (1.0 = focus on tree structure)
  lambda2: 1.0
  focus_sample: 0
  # Enable clone frequency tracking and comprehensive JSON output
  track_clone_freq: true

# Optional filtering (empty = analyze all timepoints)
filtering:
  timepoints: []

# Output and visualization options
visualization:
  generate_plots: true
  plot_format: "png"
  save_intermediate: false

# Validation and debugging
validation:
  validate_inputs: true
  # Set to true for detailed debugging
  debug_mode: false

# HPC/SLURM configuration
hpc:
  job_name: "cruk0044_longitudinal_structure"
  partition: "pool1"
  cpus_per_task: 4
  memory: "16G" 
